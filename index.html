<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Produção · Setembro 2026</title>
<style>
:root{--bg:#0f1217;--c:#1a1e25;--b:#2a303a;--t:#e8ecf2;--m:#8b95a5;--g:#34c36b;--y:#eab32f;--r:#e84545;--bl:#0a8ac7;--o:#f5a623}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 "Segoe UI",system-ui,sans-serif;padding:24px}
.w{max-width:1200px;margin:auto;display:grid;gap:16px}.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:20px}
h1{margin:4px 0;font-size:34px;letter-spacing:.5px;text-transform:uppercase}h2{margin:0 0 4px;font-size:17px;text-transform:uppercase;letter-spacing:.5px}
.s{color:var(--m);font-size:12.5px;margin:0 0 14px}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kp{border-left:4px solid var(--y);background:var(--c);border-radius:10px;padding:16px;border:1px solid var(--b);border-left-width:4px}
.kp small{color:var(--m);text-transform:uppercase;font-size:11px;letter-spacing:1px}.kp b{display:block;font-size:34px;margin:4px 0}
.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:850px){.two{grid-template-columns:1fr}}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px}.day{border:1px solid var(--b);border-radius:8px;padding:6px;text-align:center;font-size:11px;color:var(--m)}
.day b{display:block;font-size:14px}.day i{display:block;height:3px;border-radius:2px;margin-top:4px}
.ch{display:flex;align-items:flex-end;gap:4px;height:190px;border-bottom:1px solid var(--b);position:relative;margin-top:8px}
.ch div.bar{flex:1;border-radius:3px 3px 0 0;min-width:4px}.ln{position:absolute;left:0;right:0;border-top:1px dashed var(--o)}
.ax{display:flex;gap:4px;font-size:10px;color:var(--m)}.ax span{flex:1;text-align:center}
table{width:100%;border-collapse:collapse}th{font-size:11px;color:var(--m);text-transform:uppercase;text-align:right;padding:6px;border-bottom:1px solid var(--b)}td{padding:8px 6px;text-align:right;border-bottom:1px solid #232830}
th:first-child,td:first-child{text-align:left}.mono{font-family:Consolas,monospace}.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.row{margin:10px 0}.row .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}.row .top span{color:var(--m);font-size:12px}
.tr{height:9px;background:#10141a;border-radius:6px;overflow:hidden;display:flex;margin-top:4px}.tr i{display:block;height:100%}
.leg{display:flex;gap:14px;font-size:12px;color:var(--m);flex-wrap:wrap}.leg u{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;text-decoration:none}
ul{margin:0;padding-left:18px}li{margin:7px 0}.note{font-size:12px;color:var(--m)}
</style></head><body><div class="w" id="app"></div>
